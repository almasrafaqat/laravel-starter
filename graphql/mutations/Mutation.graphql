type Mutation {
    # Invoice Mutations
    createInvoice(input: CreateInvoiceInput!): Invoice @field(resolver: "App\\GraphQL\\Mutations\\InvoiceMutation@createInvoice")
    updateInvoice(id: ID!, input: CreateInvoiceInput!): Invoice @field(resolver: "App\\GraphQL\\Mutations\\InvoiceMutation@updateInvoice")
    sendInvoice(id: ID!): SendInvoiceResponse! @field(resolver: "App\\GraphQL\\Mutations\\InvoiceMutation@sendInvoice")
    deleteInvoice(id: ID!): Boolean @field(resolver: "App\\GraphQL\\Mutations\\InvoiceMutation@deleteInvoice")
    duplicateInvoice(id: ID!): Invoice @field(resolver: "App\\GraphQL\\Mutations\\InvoiceMutation@duplicateInvoice")
    
    # Company Mutations
    createCompany(input: CreateCompanyInput!): CompanyResponse! @field(resolver: "App\\GraphQL\\Mutations\\CompanyMutation@createCompany")
    updateCompany(input: UpdateCompanyInput!): CompanyResponse! @field(resolver: "App\\GraphQL\\Mutations\\CompanyMutation@updateCompany")
    deleteCompany(id: ID!): CompanyResponse! @field(resolver: "App\\GraphQL\\Mutations\\CompanyMutation@deleteCompany")
    setDefaultCompany(id: ID!): CompanyResponse! @field(resolver: "App\\GraphQL\\Mutations\\CompanyMutation@setDefaultCompany")
    
    # Company Mail Settings
    createCompanyMailSetting(input: CreateCompanyMailSettingInput!): CompanyMailSetting
        @field(resolver: "App\\GraphQL\\Mutations\\CompanyMailSettingMutations@create")
        @guard

    updateCompanyMailSetting(id: ID!, input: UpdateCompanyMailSettingInput!): CompanyMailSetting
        @field(resolver: "App\\GraphQL\\Mutations\\CompanyMailSettingMutations@update")
        @guard

    deleteCompanyMailSetting(id: ID!): Boolean
        @field(resolver: "App\\GraphQL\\Mutations\\CompanyMailSettingMutations@delete")
        @guard

    setDefaultCompanyMailSetting(id: ID!): CompanyMailSettingResponse
        @field(resolver: "App\\GraphQL\\Mutations\\CompanyMailSettingMutations@setDefault")
        @guard

    toggleActiveCompanyMailSetting(id: ID!, is_active: Boolean!): CompanyMailSettingResponse
        @field(resolver: "App\\GraphQL\\Mutations\\CompanyMailSettingMutations@toggleActive")
        @guard
}