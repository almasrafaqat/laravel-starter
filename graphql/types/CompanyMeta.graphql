"Company metadata for storing additional key-value information."
type CompanyMeta {
    id: ID!
    company_id: ID!
    meta_key: String!
    meta_value: String
    meta_data: JSON
    is_active: Boolean
    is_default: Boolean
    meta_order: Int
    meta_group: String
    meta_type: String
    company: Company! @belongsTo
}